name: Blog auto

# Publication automatique d'un article de blog, tous les lundis à 9h UTC.
# Le script choisit le prochain sujet non traité dans BLOG_WORKFLOW.md,
# le rédige via l'API OpenAI, puis met à jour le blog, le sitemap, le flux
# RSS et llms.txt. Sans nouveau sujet disponible, il sort en code 78 et le
# job se termine sans rien commiter.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: "Numéro de sujet à forcer (vide = prochain non traité)"
        required: false
        type: string
      dry_run:
        description: "Simulation : génère l'article sans rien écrire ni publier"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blog-auto
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --disable-pip-version-check openai

      - name: Generate article
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          ARGS=""
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ inputs.topic }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/generate-article.py $ARGS
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          set -e
          case "$CODE" in
            0)  echo "::notice::Article généré." ;;
            78) echo "::notice::Aucun nouveau sujet à traiter — rien à publier." ;;
            *)  echo "::error::Échec de la génération (code $CODE)."; exit "$CODE" ;;
          esac

      - name: Commit and push
        if: steps.generate.outputs.code == '0' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Aucune modification à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(blog): article auto du $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Summary
        if: always()
        run: |
          case "${{ steps.generate.outputs.code }}" in
            0)  echo "✅ Article publié." >> "$GITHUB_STEP_SUMMARY" ;;
            78) echo "ℹ️ Aucun sujet disponible dans BLOG_WORKFLOW.md." >> "$GITHUB_STEP_SUMMARY" ;;
            *)  echo "❌ Échec — voir le log de l'étape « Generate article »." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
